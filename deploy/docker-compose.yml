# docker compose --env-file .env -f deploy/docker-compose.yml up -d
#
# Secure defaults, on purpose:
#  * every published port is bound to 127.0.0.1. To serve other machines put a TLS-terminating reverse proxy in front of
#    the API; do not publish the databases.
#  * no password has a default. Compose stops with a message naming the missing variable (see .env.example).
#  * the API refuses to start without per-tenant keys (CONTEXTRAG_REQUIRE_AUTH) and without MASTER_KEY.
# This file has not been run in the environment where it was edited (no Docker daemon); see the README checklist.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY}
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: contextrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: contextrag
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}   # password of the plain role the API connects as
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./init-roles.sh:/docker-entrypoint-initdb.d/init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextrag -d contextrag"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["redis-server", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru",
              "--requirepass", "${REDIS_PASSWORD}"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY}
      # the API runs as a plain role, so row-level security on the audit table applies to it
      POSTGRES_DSN: postgresql://contextrag_app:${APP_DB_PASSWORD}@postgres:5432/contextrag
      # owner of the audit table: schema, monthly partitions and retention only
      POSTGRES_ADMIN_DSN: postgresql://contextrag:${POSTGRES_PASSWORD}@postgres:5432/contextrag
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BM25: ${BM25:-incremental}            # same scores as rank_bm25 but no rebuild per ingest (measured ~1.8x qps under mixed load)
      EMBEDDER: ${EMBEDDER:-hashing}        # hashing | bge
      RERANKER: ${RERANKER:-lexical}        # lexical | cross-encoder | cohere
      NLI: ${NLI:-lexical}                  # lexical | deberta
      LLM: ${LLM:-extractive}               # extractive | anthropic | ollama
      LLM_MODEL: ${LLM_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY (python -c "import secrets; print(secrets.token_urlsafe(32))")}
      MASTER_KEY_PREVIOUS: ${MASTER_KEY_PREVIOUS:-}          # only while rotating; see README
      CONTEXTRAG_REQUIRE_AUTH: "true"                        # refuse to run in open or shared-secret mode
      CONTEXTRAG_KEYS_FILE: ${CONTEXTRAG_KEYS_FILE:?set CONTEXTRAG_KEYS_FILE to the path of the keys file inside the container}
      CONTEXTRAG_RATE_LIMIT_PER_MIN: ${CONTEXTRAG_RATE_LIMIT_PER_MIN:-}
      # Audit minimisation: the log keeps lengths, not text. Set to "full" only to investigate an incident.
      CONTEXTRAG_AUDIT_QUESTION: ${CONTEXTRAG_AUDIT_QUESTION:-omit}
      CONTEXTRAG_AUDIT_ANSWER: ${CONTEXTRAG_AUDIT_ANSWER:-omit}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      qdrant: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  qdrant_data:
  pg_data:
