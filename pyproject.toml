[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextrag"
version = "0.2.0"
description = "RAG pipeline with hybrid retrieval and NLI-verified, citation-grounded answers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rank-bm25>=0.2.2", "numpy>=1.24"]

[project.scripts]
contextrag = "contextrag.__main__:main"

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
qdrant = ["qdrant-client>=1.10"]
redis = ["redis>=5"]
models = ["sentence-transformers>=3.0", "transformers>=4.40", "torch"]
cohere = ["cohere>=5"]
anthropic = ["anthropic>=0.40"]
postgres = ["psycopg[binary,pool]>=3.1"]
pdf = ["pypdf>=4"]
security = ["cryptography>=42"]
memory = ["prometheus-client>=0.20"]
# ragas 0.4.3 imports a langchain_community symbol removed in 0.4.x, hence the upper bound.
ragas = ["ragas==0.4.3", "langchain-community<0.4", "anthropic>=0.40", "openai>=1.40"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "qdrant-client>=1.10", "cryptography>=42", "pypdf>=4",
       "redis>=5", "fakeredis>=2.20", "psycopg[binary,pool]>=3.1", "pyyaml>=6", "ruff>=0.4",
       "prometheus-client>=0.20", "cryptography>=42"]

[tool.setuptools.packages.find]
include = ["contextrag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning:qdrant_client", "ignore::DeprecationWarning"]

[tool.setuptools.package-data]
"contextrag.eval" = ["data/*.json"]

[tool.ruff.lint]
select = ["F", "E9", "B"]
ignore = ["B008", "B904"]  # FastAPI Depends()/Header() defaults; explicit re-raise chaining not needed in handlers

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B905"]  # zip() strictness is irrelevant in assertions
