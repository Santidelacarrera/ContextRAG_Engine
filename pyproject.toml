[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextrag"
version = "0.1.0"
description = "RAG pipeline with hybrid retrieval and NLI-verified, citation-grounded answers"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
qdrant = ["qdrant-client>=1.10"]
models = ["sentence-transformers>=3.0", "transformers>=4.40", "torch"]
cohere = ["cohere>=5"]
anthropic = ["anthropic>=0.40"]
postgres = ["psycopg[binary]>=3.1"]
pdf = ["pypdf>=4"]
security = ["cryptography>=42"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "qdrant-client>=1.10", "cryptography>=42"]

[tool.setuptools.packages.find]
include = ["contextrag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
