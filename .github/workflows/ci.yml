name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"  # weekly: new advisories appear without any code change
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Redis and PostgreSQL (integration tests skip themselves if absent)
        run: sudo apt-get update && sudo apt-get install -y redis-server postgresql
      - run: pip install -e ".[dev,api]"
      - run: ruff check contextrag tests
      - run: pip install mypy && mypy contextrag --ignore-missing-imports
      - run: pytest -q
      - name: Benchmark dataset is exactly what its generator produces
        run: python -m contextrag.eval.bench_corpus --check
      - name: Retrieval/grounding benchmark (fails if a metric fell below the recorded floor)
        run: python -m contextrag bench --check-baseline
      - name: Safety evaluation (fails on any unsupported claim approved or unsafe answer)
        run: python -m contextrag eval

  models:
    # real transformers / sentence-transformers / torch code paths, exercised with tiny local random-weight models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,api,models]"
      - run: pytest -q tests/test_models_local.py

  audit:
    # known-vulnerability scan of the runtime dependencies (no dev tools), resolved fresh from the extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[api,pdf,security,memory,postgres,qdrant,redis]" pip-audit
      - run: pip-audit --local --skip-editable

  compose-smoke:
    # builds the image and brings up the real stack (Qdrant, PostgreSQL, Redis, API); ingest + verified query end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Secrets and keys for a throwaway stack
        run: |
          r() { python -c "import secrets;print(secrets.token_hex(16))"; }
          { echo "QDRANT_API_KEY=$(r)"; echo "POSTGRES_PASSWORD=$(r)"; echo "APP_DB_PASSWORD=$(r)"; echo "REDIS_PASSWORD=$(r)";
            echo "MASTER_KEY=$(r)"; echo "CONTEXTRAG_KEYS_FILE=/run/keys.json";
            echo "CONTEXTRAG_KEYS_HOST_FILE=$RUNNER_TEMP/keys.json"; } > "$RUNNER_TEMP/stack.env"
          python -m contextrag keygen --id smoke --tenant acme --role admin --add-to "$RUNNER_TEMP/keys.json" > "$RUNNER_TEMP/key"
          chmod 644 "$RUNNER_TEMP/keys.json"   # the container user (uid 10001) must be able to read it
      - run: docker compose --env-file "$RUNNER_TEMP/stack.env" -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 180
      - name: Ingest and query
        run: |
          K=$(cat "$RUNNER_TEMP/key")
          curl -fsS localhost:8000/healthz
          curl -fsS -X POST localhost:8000/ingest -H "X-API-Key: $K" -H 'content-type: application/json' \
            -d '{"documents":[{"doc_id":"d1","text":"Las claves de API se rotan cada 30 dias."}]}'
          curl -fsS -X POST localhost:8000/query -H "X-API-Key: $K" -H 'content-type: application/json' \
            -d '{"question":"Cada cuanto se rotan las claves de API?"}' | tee out.json
          grep -q '"status":"verified"' out.json
      - if: failure()
        run: docker compose --env-file "$RUNNER_TEMP/stack.env" -f deploy/docker-compose.yml logs --tail 80

  image-scan:
    # vulnerability scan of the built API image; fails on fixable HIGH/CRITICAL findings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f deploy/Dockerfile -t contextrag-api:ci .
      - name: Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0 image             --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --quiet contextrag-api:ci
